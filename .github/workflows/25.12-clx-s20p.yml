name: 25.12-clx-s20p-docker

env:
  DEVICE_NAME: 25.12-clx-s20p
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
#  REPO_URL: https://github.com/jameslau-tech/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 25.12/mt7986-clx-s20p.config
  #CONFIG_FILE: 25.12/s20pc.config
  DIY_P1_SH: 25.12/diy-part1.sh
  DIY_P2_SH: 25.12/diy-part2.sh
  DIY_P3_SH: diy-partX.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

  # 强制 JavaScript Action 使用 Node.js 24，避免 Node 20 弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      disable_packages:
        description: '要禁用的包（空格分隔，例: nano htop tcpdump）'
        required: false
        default: 'nano'  
# =========================================================
# 权限声明
# 创建/上传/删除 Release、删除 workflow runs 必需
# =========================================================
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    # =========================================================
    # 1. 释放空间 + 初始化编译环境
    # =========================================================
    - name: Free disk space & init build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 删除大型预装软件
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm
        sudo docker image prune --all --force

        # 配置 12GB Swap（Rust/LLVM 编译需要大量虚拟内存）
        sudo swapoff -a && sudo rm -f /mnt/swapfile
        sudo fallocate -l 12G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile

        # 系统更新
        sudo -E apt-get -yqq purge firefox snapd
        sudo -E apt-get -yqq update
        sudo -E apt-get -yqq full-upgrade

        # 安装 eBPF / daed 编译依赖
        sudo -E apt-get -yqq install clang llvm dwarves build-essential \
          libssl-dev libelf-dev bc flex bison python3 xz-utils tar \
          dos2unix libfuse-dev

        # 安装 ImmortalWrt 官方编译依赖
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

        # 安装 pnpm（daed 前端构建需要）
        sudo npm install -g pnpm

        # 清理
        sudo -E apt-get -yqq autoremove --purge
        sudo -E apt-get -yqq clean
        sudo -E timedatectl set-timezone "$TZ"

        sudo mkdir -p /workdir
        sudo chown "$USER":"$USER" /workdir

        echo "磁盘空间:"
        df -hT

        echo "内存/Swap:"
        free -h

    # =========================================================
    # 2. 克隆源码
    # =========================================================
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT "$PWD"
        git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    # =========================================================
    # 3. 更新并安装 Feeds
    # =========================================================
    - name: Update & install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # =========================================================
    # 4. 加载自定义 Feeds
    # =========================================================
    - name: Load custom feeds (diy-part1.sh)
      run: |
        [ -e "$FEEDS_CONF" ] && cp "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    # =========================================================
    # 5. 加载自定义配置 (diy-part2.sh)
    # =========================================================
    - name: Load custom configuration (diy-part2.sh)
      run: |
        [ -e files ] && cp -r files openwrt/files
        [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    # =========================================================
    # 5.5 加载自定义配置 (diy-part3.sh)
    # =========================================================
    - name: Load custom configuration (diy-part3.sh)
      env:
        KEEP_I18N: base    # 空格分隔，如 "base package-manager"；留空则全部裁掉
      run: |
        cd openwrt
        set -euo pipefail
        # （顺带提醒：原 workflow 从未调用过 DIY_P3_SH，如需要请在此补上）
        if [ -n "${DIY_P3_SH:-}" ] && [ -f "$GITHUB_WORKSPACE/$DIY_P3_SH" ]; then
          chmod +x "$GITHUB_WORKSPACE/$DIY_P3_SH"
          "$GITHUB_WORKSPACE/$DIY_P3_SH"
        fi

    # =========================================================
    # 5.55 Patch dockerd: drop legacy iptables dependencies
    # =========================================================
    - name: Remove legacy iptables dependencies from dockerd
      run: |
        cd openwrt
        set -euo pipefail
        MAKEFILE="feeds/packages/utils/dockerd/Makefile"
        if [ ! -f "$MAKEFILE" ]; then
          echo "ERROR: dockerd Makefile not found: $MAKEFILE"; exit 1
        fi
        echo "========== DEPENDS (before) =========="
        sed -n '/define Package\/dockerd$/,/^endef/p' "$MAKEFILE"
    
        # 1) 整行删除（覆盖 +IPV6: 条件前缀、iptables 全部变体、续行反斜杠）
        sed -i -E \
          -e '/^[[:space:]]*\+(IPV6:)?(iptables|ip6tables|iptables-mod-[a-z0-9-]+|ip6tables-mod-[a-z0-9-]+|kmod-ipt-[a-z0-9-]+)[[:space:]]*\\?[[:space:]]*$/d' \
          "$MAKEFILE"
    
        # 2) 兜底：同一行混排多个依赖时逐个剔除
        sed -i -E \
          -e 's/\+(IPV6:)?(iptables|ip6tables|iptables-mod-[a-z0-9-]+|ip6tables-mod-[a-z0-9-]+|kmod-ipt-[a-z0-9-]+)([[:space:]]+|$)/ /g' \
          "$MAKEFILE"
    
        echo "========== DEPENDS (after) =========="
        sed -n '/define Package\/dockerd$/,/^endef/p' "$MAKEFILE"
    
        # 3) 双向校验：iptables 系依赖清零，必要依赖未被误删
        if grep -Eq '\+(IPV6:)?(iptables|ip6tables|kmod-ipt-)' "$MAKEFILE"; then
          echo "ERROR: iptables dependencies still present"; exit 1
        fi
        for dep in containerd kmod-veth tini uci-firewall kmod-nf-ipvs; do
          grep -q "+${dep}" "$MAKEFILE" \
            || { echo "ERROR: ${dep} was accidentally removed"; exit 1; }
        done
        echo "dockerd iptables dependencies removed OK."
    
    # =========================================================
    # 5.56 dockerd native nftables-only configuration (files overlay)
    # =========================================================
    - name: Generate dockerd nftables-only daemon config
      run: |
        cd openwrt
        set -euo pipefail
        mkdir -p files/etc/docker files/etc/uci-defaults
    
        # dockerd >=29 支持 firewall-backend=nftables
        # dockerd <29 不支持该 key（会被拒启），降级为仅 iptables:false + fw4 NAT
        # ImmortalWrt 25.12 的 packages feed 当前是 27.x，会走 else 分支；
        # 保留分支判断是为了未来 feed 升级到 29 后无需再改 workflow
        if grep -Eq '^PKG_VERSION:=(2[9-9]|[3-9][0-9])\.' \
             feeds/packages/utils/dockerd/Makefile; then
          cat > files/etc/docker/daemon.json <<'EOF'
        {
          "iptables": false,
          "ip6tables": false,
          "firewall-backend": "nftables",
          "data-root": "/opt/docker",
          "log-driver": "local",
          "log-opts": {
            "max-size": "10m",
            "max-file": "3",
            "compress": "true"
          },
          "registry-mirrors": [
            "https://docker.1ms.run",
            "https://docker.xuanyuan.me",
            "https://docker.m.daocloud.io",
            "https://docker.1panel.live",
            "https://dockerproxy.net"
          ]
        }
        EOF
        else
          cat > files/etc/docker/daemon.json <<'EOF'
        {
          "iptables": false,
          "ip6tables": false,
          "data-root": "/opt/docker",
          "log-driver": "local",
          "log-opts": {
            "max-size": "10m",
            "max-file": "3",
            "compress": "true"
          },
          "registry-mirrors": [
            "https://docker.1ms.run",
            "https://docker.xuanyuan.me",
            "https://docker.m.daocloud.io",
            "https://docker.1panel.live",
            "https://dockerproxy.net"
          ]
        }
        EOF
        fi
        cat files/etc/docker/daemon.json
    
        # dockerd.init 的 process_config 读到 alt_config_file 后会软链过去
        # 并跳过 UCI 配置生成与 iptables_add_blocking_rule
        cat > files/etc/uci-defaults/99-dockerd-nftables <<'EOF'
        #!/bin/sh
        [ -f /etc/config/dockerd ] || touch /etc/config/dockerd
        uci -q get dockerd.globals >/dev/null || uci -q set dockerd.globals=globals
        uci -q set dockerd.globals.alt_config_file='/etc/docker/daemon.json'
        uci -q set dockerd.globals.iptables='0'
        uci -q set dockerd.globals.ip6tables='0'
        uci -q commit dockerd
    
        # iptables=false 时 dockerd 不做 NAT，由 fw4 的 docker zone 负责
        if ! uci -q get firewall.docker >/dev/null; then
          uci -q add firewall zone >/dev/null
          uci -q rename firewall.@zone[-1]='docker'
          uci -q set firewall.docker.name='docker'
          uci -q set firewall.docker.input='ACCEPT'
          uci -q set firewall.docker.output='ACCEPT'
          uci -q set firewall.docker.forward='ACCEPT'
          uci -q set firewall.docker.masq='1'
          uci -q add_list firewall.docker.network='docker'
          uci -q commit firewall
        fi
        exit 0
        EOF
        chmod +x files/etc/uci-defaults/99-dockerd-nftables
        echo "daemon.json + uci-defaults generated."
    
    # =========================================================
    # 5.57 eMMC p6 常驻挂载 /opt + USB 挂载到 /opt/usb/<dev>（排除 p5）
    # =========================================================
    - name: Generate mount overlay (p6 -> /opt, USB -> /opt/usb/*)
      run: |
        cd openwrt
        set -euo pipefail
        mkdir -p files/usr/bin files/etc/hotplug.d/block files/etc/uci-defaults
    
        # ---- 1) mount-opt: p6 -> /opt 常驻; USB -> /opt/usb/sdX1 ----
        cat > files/usr/bin/mount-opt <<'EOF'
        #!/bin/sh
        # 只允许: mmcblk0p6 -> /opt, sdXN -> /opt/usb/sdXN
        # 明确排除 mmcblk0p5(rootfs/rom+overlay) 及 p1~p4 引导分区
        ROOT_PART="mmcblk0p6"
        OPT="/opt"
    
        mount_opt_root() {
            mkdir -p "$OPT"
            grep -qs " ${OPT} " /proc/mounts && return 0
            [ -b "/dev/${ROOT_PART}" ] || return 1
            mount -o rw,noatime "/dev/${ROOT_PART}" "$OPT" 2>/dev/null \
                && logger -t mount-opt "mounted /dev/${ROOT_PART} -> ${OPT}"
        }
    
        mount_usb() {
            local dev="${1##*/}" mnt
            case "$dev" in sd[a-z][0-9]*) ;; *) return 1 ;; esac
            mount_opt_root                  # 先保证 /opt 已被 p6 挂载
            mnt="${OPT}/usb/${dev}"
            mkdir -p "$mnt"
            grep -qs " ${mnt} " /proc/mounts && return 0
            mount -o rw,noatime "/dev/${dev}" "$mnt" \
                && logger -t mount-opt "mounted /dev/${dev} -> ${mnt}"
        }
    
        umount_usb() {
            local dev="${1##*/}" mnt="${OPT}/usb/${1##*/}"
            grep -qs " ${mnt} " /proc/mounts && umount "$mnt" \
                && logger -t mount-opt "umounted ${mnt}"
        }
    
        case "$1" in
            mount-root) mount_opt_root ;;
            mount)      mount_usb "$2" ;;
            umount)     umount_usb "$2" ;;
            *) echo "usage: $0 mount-root|mount|umount [dev]" ;;
        esac
        EOF
        chmod +x files/usr/bin/mount-opt
    
        # ---- 2) hotplug: 只响应 U 盘事件, 彻底不再触碰 mmcblk ----
        cat > files/etc/hotplug.d/block/40-mount-opt <<'EOF'
        case "$ACTION" in
            add)
                case "$DEVNAME" in
                    sd[a-z][0-9]*)
                        ( sleep 1; /usr/bin/mount-opt mount "/dev/$DEVNAME" ) &
                        ;;
                esac
                ;;
            remove)
                case "$DEVNAME" in
                    sd[a-z][0-9]*)
                        /usr/bin/mount-opt umount "/dev/$DEVNAME"
                        ;;
                esac
                ;;
        esac
        EOF
    
        # ---- 3) 首次开机: 禁 blockd, 兜底挂 p6 -> /opt ----
        cat > files/etc/uci-defaults/99-mount-opt <<'EOF'
        #!/bin/sh
        # blockd 会把 U 盘挂到 /mnt/sda1 并可能乱挂 eMMC 分区, 禁用
        [ -x /etc/init.d/blockd ] && /etc/init.d/blockd disable
        mkdir -p /opt
        ( n=0
          while [ "$n" -lt 10 ] && [ ! -b /dev/mmcblk0p6 ]; do
              sleep 1; n=$((n+1))
          done
          /usr/bin/mount-opt mount-root
        ) &
        exit 0
        EOF
        chmod +x files/etc/uci-defaults/99-mount-opt
    
        # ---- 4) 压制源码可能预置的 p5 -> /opt 挂载项 + 显式声明 p6 ----
        cat > files/etc/uci-defaults/98-fix-fstab <<'EOF'
        #!/bin/sh
        touch /etc/config/fstab
        for s in $(uci -q show fstab | sed -n 's/^fstab\.\([^.]*\)\.device=.*/\1/p'); do
            case "$(uci -q get fstab.$s.device)" in
                *mmcblk0p5*) uci -q delete fstab.$s ;;
            esac
        done
        uci -q get fstab.optroot >/dev/null || {
            uci -q set fstab.optroot=mount
            uci -q set fstab.optroot.target='/opt'
            uci -q set fstab.optroot.device='/dev/mmcblk0p6'
            uci -q set fstab.optroot.fstype='ext4'
            uci -q set fstab.optroot.options='rw,noatime'
            uci -q set fstab.optroot.enabled='1'
        }
        uci -q commit fstab
        exit 0
        EOF
        chmod +x files/etc/uci-defaults/98-fix-fstab
    
        echo "mount overlay generated."
        find files/usr/bin/mount-opt files/etc/hotplug.d/block/40-mount-opt files/etc/uci-defaults/98-fix-fstab files/etc/uci-defaults/99-mount-opt
    
        
    # =========================================================
    # 5.58 (可选) dockerd 启动前等待 /opt 挂载
    # =========================================================
    - name: Make dockerd wait for /opt mount
      run: |
        cd openwrt
        set -euo pipefail
        INIT="feeds/packages/utils/dockerd/files/dockerd.init"
        test -f "$INIT"
        python3 - <<'PY'
        from pathlib import Path
        p = Path("feeds/packages/utils/dockerd/files/dockerd.init")
        s = p.read_text()
        wait = """start_service() {
        \t# wait for /opt (USB auto-mount), max 15s; skip if no USB disk
        \tlocal n=0
        \twhile [ "$n" -lt 15 ]; do
        \t\tgrep -qs " /opt " /proc/mounts && break
        \t\tls /dev/sd*[0-9] >/dev/null 2>&1 || [ -b /dev/mmcblk0p6 ] || break
        \t\tsleep 1
        \t\tn=$((n+1))
        \tdone
        """
        if "wait for /opt" not in s:
            assert "start_service() {" in s, "anchor not found, upstream changed!"
            s = s.replace("start_service() {", wait, 1)
            p.write_text(s)
        PY
        grep -n "wait for /opt" "$INIT"
    # =========================================================
    # 5.59 动态禁用不需要的软件包
    #      用法1：改 env.DISABLE_PACKAGES 默认值
    #      用法2：workflow_dispatch 触发时填 disable_packages 输入
    #      注意：正确语法是 "# CONFIG_x is not set"，不是 "=n"
    # =========================================================
    - name: Disable unwanted packages
      env:
        DISABLE_PACKAGES: ${{ github.event.inputs.disable_packages || 'nano' }}
      run: |
        cd openwrt
        set -euo pipefail
        echo ">>> 计划禁用: ${DISABLE_PACKAGES:-<无>}"
        for name in $DISABLE_PACKAGES; do
          [ -n "$name" ] || continue
          sym="CONFIG_PACKAGE_${name}"
          sed -i -E "s/^${sym}=(y|m)\$/# ${sym} is not set/" .config
          grep -qE "^# ${sym} is not set\$" .config \
            || echo "# ${sym} is not set" >> .config
          echo "  ✔ ${name}"
        done
        make defconfig
        for name in $DISABLE_PACKAGES; do
          [ -n "$name" ] || continue
          if grep -qE "^CONFIG_PACKAGE_${name}=(y|m)" .config; then
            echo "ERROR: ${name} 禁用失败（可能被其他已选包 select 依赖）"
            exit 1
          fi
        done
        echo "✔ 软件包裁剪完成"
  
    # =========================================================
    # 5.6 生成 Toolchain 缓存 Key
    # =========================================================
    - name: Generate toolchain cache key
      id: cache-key
      run: |
        cd openwrt
        make defconfig 1>/dev/null 2>&1

        # 提取目标平台
        TARGET=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
        SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)

        # 基于 tools/ 和 toolchain/ 源码生成 hash
        TOOLS_HASH=$(find tools toolchain -type f \( -name "Makefile" -o -name "*.mk" \) \
          -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)

        CACHE_KEY="toolchain-${TARGET}-${SUBTARGET}-${TOOLS_HASH:0:16}"
        CACHE_PREFIX="toolchain-${TARGET}-${SUBTARGET}"

        echo "CACHE_KEY=$CACHE_KEY" >> "$GITHUB_OUTPUT"
        echo "CACHE_PREFIX=$CACHE_PREFIX" >> "$GITHUB_OUTPUT"

        echo "========================================"
        echo "🔑 缓存 Key: $CACHE_KEY"
        echo "📌 缓存前缀: $CACHE_PREFIX"
        echo "========================================"

    # =========================================================
    # 5.7 恢复 Toolchain —— 第一优先: actions/cache
    # =========================================================
    - name: Restore toolchain from actions/cache
      uses: actions/cache/restore@v5
      id: cache-restore
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    # =========================================================
    # 5.8 恢复 Toolchain —— 第二优先: Release 备份
    # 精确匹配当前 CACHE_KEY.tzst，避免恢复旧工具链
    # =========================================================
    - name: Restore toolchain from Release backup
      if: steps.cache-restore.outputs.cache-hit != 'true'
      id: release-restore
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt

        CACHE_KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        ASSET_NAME="${CACHE_KEY}.tzst"

        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "restored=false" >> "$GITHUB_OUTPUT"
          echo "⚠️ toolchain-cache Release 不存在，可能是首次运行"
          exit 0
        fi

        if gh release view toolchain-cache \
          --repo "$GITHUB_REPOSITORY" \
          --json assets \
          -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET_NAME"; then

          echo "📦 从 Release 下载工具链: $ASSET_NAME"
          echo "📍 Release 仓库: $GITHUB_REPOSITORY"

          gh release download toolchain-cache \
            --repo "$GITHUB_REPOSITORY" \
            -p "$ASSET_NAME" \
            -D .

          if [ -e "$ASSET_NAME" ]; then
            echo "📂 解压工具链缓存..."
            tar -I unzstd -xf "$ASSET_NAME" || tar -xf "$ASSET_NAME"
            rm -f "$ASSET_NAME"

            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "✅ Release 备份恢复成功"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "❌ Release 下载失败，未找到文件: $ASSET_NAME"
          fi
        else
          echo "restored=false" >> "$GITHUB_OUTPUT"
          echo "⚠️ Release 中没有当前缓存文件: $ASSET_NAME"
        fi

    # =========================================================
    # 5.9 处理 Toolchain
    # - actions/cache 命中：跳过工具链编译，不保存缓存
    # - Release 命中：跳过工具链编译，但重新写入 actions/cache
    # - 全部未命中：编译工具链，同时保存 actions/cache 和 Release
    # =========================================================
    - name: Handle toolchain
      id: toolchain
      run: |
        cd openwrt

        CACHE_HIT="${{ steps.cache-restore.outputs.cache-hit }}"
        RELEASE_HIT="${{ steps.release-restore.outputs.restored }}"

        if [ "$CACHE_HIT" = "true" ]; then
          echo "✅ actions/cache 命中，工具链已恢复"
          echo "need_build=false" >> "$GITHUB_OUTPUT"
          echo "need_save_cache=false" >> "$GITHUB_OUTPUT"
          echo "need_save_release=false" >> "$GITHUB_OUTPUT"

        elif [ "$RELEASE_HIT" = "true" ]; then
          echo "✅ Release 工具链缓存命中"
          echo "📌 将重新写入 actions/cache，加速下次构建"
          echo "need_build=false" >> "$GITHUB_OUTPUT"
          echo "need_save_cache=true" >> "$GITHUB_OUTPUT"
          echo "need_save_release=false" >> "$GITHUB_OUTPUT"

        else
          echo "=========================================="
          echo "⏳ 无可用缓存，开始编译工具链..."
          echo "=========================================="

          make tools/install -j"$(nproc)" || make tools/install -j1 V=s || {
            echo "❌ tools 编译失败"
            exit 1
          }
          echo "✅ tools 编译完成"

          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s || {
            echo "❌ toolchain 编译失败"
            exit 1
          }
          echo "✅ toolchain 编译完成"

          echo "need_build=true" >> "$GITHUB_OUTPUT"
          echo "need_save_cache=true" >> "$GITHUB_OUTPUT"
          echo "need_save_release=true" >> "$GITHUB_OUTPUT"
        fi

        # 修改 Makefile，确保后续 make 跳过工具链重编
        sed -i 's/ $(tool.*\/stamp-compile)//' Makefile
        echo "📌 Makefile 已修改，后续编译将跳过工具链"

    # =========================================================
    # 5.10 保存 Toolchain 到 actions/cache
    # - 首次编译后保存
    # - 从 Release 恢复后也保存
    # =========================================================
    - name: Save toolchain to actions/cache
      uses: actions/cache/save@v5
      if: steps.toolchain.outputs.need_save_cache == 'true'
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    # =========================================================
    # 5.11 保存 Toolchain 到 Release 备份
    # 仅首次编译工具链时执行
    # =========================================================
    - name: Save toolchain to Release backup
      if: steps.toolchain.outputs.need_save_release == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd openwrt

        CACHE_KEY="${{ steps.cache-key.outputs.CACHE_KEY }}"
        CACHE_PREFIX="${{ steps.cache-key.outputs.CACHE_PREFIX }}"

        echo "📦 打包工具链..."
        tar -I zstdmt -cf "${CACHE_KEY}.tzst" staging_dir/host* staging_dir/tool*
        ls -lh "${CACHE_KEY}.tzst"

        echo "📍 Release 目标仓库: $GITHUB_REPOSITORY"

        if ! gh release view toolchain-cache --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "📝 创建 toolchain-cache Release..."
          gh release create toolchain-cache \
            --repo "$GITHUB_REPOSITORY" \
            --title "Toolchain Cache" \
            --notes "自动生成的工具链缓存，请勿手动删除" \
            --latest=false
        fi

        # 删除同平台旧缓存，避免 Release 越积越多
        gh release view toolchain-cache \
          --repo "$GITHUB_REPOSITORY" \
          --json assets \
          -q '.assets[].name' 2>/dev/null | \
          grep "^${CACHE_PREFIX}" | while read -r old_file; do
            echo "🗑️ 删除旧缓存: $old_file"
            gh release delete-asset toolchain-cache "$old_file" \
              --repo "$GITHUB_REPOSITORY" \
              -y 2>/dev/null || true
          done

        echo "📤 上传到 Release..."
        gh release upload toolchain-cache "${CACHE_KEY}.tzst" \
          --repo "$GITHUB_REPOSITORY" \
          --clobber

        rm -f "${CACHE_KEY}.tzst"
        echo "✅ 工具链已备份到 Release"

    # =========================================================
    # 6. SSH 调试（可选）
    # =========================================================
    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')

    # =========================================================
    # 7. 下载软件包
    # =========================================================
    - name: Download packages
      id: package
      env:
        KEEP_I18N: base        # 空格分隔，如 "base package-manager"；留空则全部裁掉
      run: |
        cd openwrt
        make defconfig
            # ========== LuCI 中文翻译裁剪（白名单机制） ==========
        set -euo pipefail
        echo ">>> [1/4] 关闭全局语言开关 CONFIG_LUCI_LANG_zh_Hans"
        sed -i '/^CONFIG_LUCI_LANG_zh_Hans=/d; /^# CONFIG_LUCI_LANG_zh_Hans is not set$/d' .config
        echo '# CONFIG_LUCI_LANG_zh_Hans is not set' >> .config
    
        echo ">>> [2/4] 关闭全部 luci-i18n-*-zh-cn"
        sed -i -E 's/^(CONFIG_PACKAGE_luci-i18n-[a-zA-Z0-9_-]+-zh-cn)=(y|m)/# \1 is not set/' .config
    
        echo ">>> [3/4] 放行白名单: ${KEEP_I18N:-<空>}"
        for name in ${KEEP_I18N:-}; do
          [ -n "$name" ] || continue
          sym="CONFIG_PACKAGE_luci-i18n-${name}-zh-cn"
          sed -i "s|^# ${sym} is not set|${sym}=y|" .config
          grep -q "^${sym}=y$" .config || echo "${sym}=y" >> .config
          if ! grep -qE "^CONFIG_PACKAGE_luci-app-${name}=(y|m)$" .config && \
             ! grep -qE "^CONFIG_PACKAGE_luci-${name}=(y|m)$" .config; then
            echo "ERROR: ${sym} 依赖的 LuCI 包未启用（luci-app-${name} 或 luci-${name}）"
            exit 1
          fi
        done
    
        echo ">>> [4/4] 校验（不运行 defconfig）"
        KEEP_RE=$(echo "${KEEP_I18N:-}" | tr ' ' '|')
        BAD=$(grep -E '^CONFIG_PACKAGE_luci-i18n-[a-zA-Z0-9_-]+-zh-cn=(y|m)' .config \
                | grep -vE "luci-i18n-(${KEEP_RE})-zh-cn" || true)
        [ -z "$BAD" ] || { echo "白名单外残留:"; echo "$BAD"; exit 1; }
        echo "✔ 翻译裁剪完成"
        # =====================================================

        make download -j8 || make download -j1 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # =========================================================
    # 8. 编译固件
    # =========================================================
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt

        echo "开始编译... ($(nproc) 线程)"
        df -hT /

        if make -j"$(nproc)"; then
          echo "多线程编译成功"
        elif make -j1; then
          echo "单线程编译成功"
        elif make -j1 V=s; then
          echo "单线程详细日志编译成功"
        else
          echo "编译失败"
          exit 1
        fi

        echo "========================================"
        echo "固件编译完成"
        echo "最终磁盘空间:"
        df -hT /
        echo "========================================"

        echo "status=success" >> "$GITHUB_OUTPUT"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    # =========================================================
    # 8.5 空间检查
    # =========================================================
    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    # =========================================================
    # 9. 上传 bin 目录（Artifacts）
    # =========================================================
    - name: Upload bin directory
      uses: actions/upload-artifact@v5
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    # =========================================================
    # 10. 整理固件文件
    # =========================================================
    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'   # 原: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@v5
      if: steps.compile.outputs.status == 'success' && steps.organize.outputs.status == 'success'   # 原: ... && !cancelled()
      with:
        name: OpenWrt_firmware_${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # =========================================================
    # 11. 生成发布标签和日志
    # =========================================================
    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'   # 原: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        AUTHOR=$(echo "${{ env.REPO_URL }}" | cut -d'/' -f4)
        DEVICE_NAME="${{ env.DEVICE_NAME }}"
        BRANCH="${{ env.REPO_BRANCH }}"
        BUILD_TIME=$(date +"%Y%m%d-%H%M")

        RELEASE_TAG="${DEVICE_NAME}-${AUTHOR}-${BRANCH}-${BUILD_TIME}"
        RELEASE_TAG=$(echo "$RELEASE_TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')

        echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

        touch release.txt
        echo "## 🚀 OpenWrt 自动编译固件" >> release.txt
        echo "" >> release.txt
        echo "### 📋 编译信息" >> release.txt
        echo "| 项目 | 详情 |" >> release.txt
        echo "|------|------|" >> release.txt
        echo "| 📱 设备名称 | \`${DEVICE_NAME}\` |" >> release.txt
        echo "| 👤 源码作者 | \`${AUTHOR}\` |" >> release.txt
        echo "| 🔗 源码仓库 | ${{ env.REPO_URL }} |" >> release.txt
        echo "| 🌿 分支版本 | \`${BRANCH}\` |" >> release.txt
        echo "| ⏰ 编译时间 | $(date '+%Y-%m-%d %H:%M:%S') (Shanghai) |" >> release.txt
        echo "| 🏷️ 版本标签 | \`${RELEASE_TAG}\` |" >> release.txt
        echo "" >> release.txt
        echo "---" >> release.txt
        echo "> ⚠️ **注意**: 请根据自己的机型选择对应的 Factory 或 Sysupgrade 固件" >> release.txt

        echo "status=success" >> "$GITHUB_OUTPUT"

    # =========================================================
    # 12. 发布到 GitHub Release
    # =========================================================
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2.3.2
      if: steps.compile.outputs.status == 'success' && steps.tag.outputs.status == 'success'   # 原: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.ipk
          ${{ env.FIRMWARE }}/*.img.gz
          ${{ env.FIRMWARE }}/*.manifest
          ${{ env.FIRMWARE }}/*.tar.gz

    # =========================================================
    # 13. 清理旧的工作流记录
    # =========================================================
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 1
        keep_minimum_runs: 10

    # =========================================================
    # 14. 清理旧的 Release 发布
    # delete_tag_pattern 只删本设备固件 Release
    # 不会误删 toolchain-cache
    # =========================================================
    - name: Remove old releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'   # 原: ... && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
        delete_tag_pattern: '^${{ env.DEVICE_NAME }}-'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
